<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="x-apple-disable-message-reformatting">
    <title></title>

    <style>
        html,
        body {
            margin: 0 auto !important;
            padding: 0 !important;
            height: 100% !important;
            width: 100% !important;
            background: #f1f1f1;
        }

        * {
            -ms-text-size-adjust: 100%;
            -webkit-text-size-adjust: 100%;
        }

        table,
        td {
            mso-table-lspace: 0pt !important;
            mso-table-rspace: 0pt !important;
        }

        table {
            border-spacing: 0 !important;
            border-collapse: collapse !important;
            table-layout: fixed !important;
            margin: 0 auto !important;
        }

                                <img
                                    src="{{logoUrl}}"
                                    alt="{{brandName}}"
                                    width="180"
                                    style="
                                        max-width: 180px;
                                        height: auto;
                                        display: inline-block;
                                        margin-bottom: 12px;
                                    "
                                />
            font-family: inherit !important;
            font-weight: inherit !important;
            line-height: inherit !important;
        }
    </style>
    <!--[if mso]>
    <style>
        * {
            font-family: sans-serif !important;
        }
    </style>
    <![endif]-->
    <!--[if !mso]><!-->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&display=swap');
    </style>
    <!--<![endif]-->
</head>

<body width="100%" style="margin: 0; padding: 0 !important; mso-line-height-rule: exactly; background-color: #f0f4ff;">
    <div style="display: none; font-size: 1px; line-height: 1px; max-height: 0px; max-width: 0px; opacity: 0; overflow: hidden; mso-hide: all; font-family: sans-serif;">
        {{preheader}}
    </div>
    <center style="width: 100%; background-color: #f0f4ff;">
    <div style="max-width: 600px; margin: 0 auto;">
        <!--[if mso]>
        <table align="center" role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" style="margin: auto;">
        <tr>
        <td>
        <![endif]-->
        <table align="center" role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="margin: auto;">
            <tr>
                <td style="padding: 1em 2.5em; text-align: center;">
                    <img src="{{logoUrl}}" alt="Busmo Logo" width="120" style="max-width: 120px; height: auto;">
                </td>
            </tr>
            <tr>
                <td valign="middle" style="padding: 2em; background-color: #ffffff; border-radius: 5px;">
                    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                        <tr>
                            <td style="font-family: 'Manrope', sans-serif; font-size: 15px; line-height: 1.5; color: #1A237E;">
                                {{{content}}}
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
             <!-- 1 Column Text + Button : END -->
        </table>
        <table align="center" role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="margin: auto;">
            <tr>
                <td valign="middle" style="padding: 2.5em; text-align: center;">
                    <p style="font-family: 'Manrope', sans-serif; color: #555; font-size: 12px; margin:0;">{{footerText}}</p>
                    <p style="margin-top:10px;">
                        {{#if twitterUrl}}<a href="{{twitterUrl}}" style="margin: 0 5px;"><img src="https://storage.googleapis.com/bizassistant2-62305643-adad7.appspot.com/twitter-icon.png" width="24" alt="Twitter"></a>{{/if}}
                        {{#if facebookUrl}}<a href="{{facebookUrl}}" style="margin: 0 5px;"><img src="https://storage.googleapis.com/bizassistant2-62305643-adad7.appspot.com/facebook-icon.png" width="24" alt="Facebook"></a>{{/if}}
                        {{#if instagramUrl}}<a href="{{instagramUrl}}" style="margin: 0 5px;"><img src="https://storage.googleapis.com/bizassistant2-62305643-adad7.appspot.com/instagram-icon.png" width="24" alt="Instagram"></a>{{/if}}
                    </p>
                </td>
            </tr>
        </table>
        <!--[if mso]>
        </td>
        </tr>
        </table>
        <![endif]-->
    </div>
    </center>
</body>
</html>
