<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5717ee" />
    <title>Busmo — Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f4f7;
        --card: #ffffff;
        --text: #1a1a2e;
        --muted: #6b7280;
        --purple: #5717ee;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f0f14;
          --card: #1a1a24;
          --text: #f3f4f6;
          --muted: #9ca3af;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: var(--card);
        border-radius: 20px;
        padding: 32px 28px;
        box-shadow: 0 12px 40px rgba(87, 23, 238, 0.12);
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(87, 23, 238, 0.12);
        color: var(--purple);
        font-weight: 600;
        font-size: 0.85rem;
        padding: 6px 12px;
        border-radius: 999px;
        margin-bottom: 16px;
      }
      h1 { font-size: 1.4rem; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: var(--muted); line-height: 1.5; }
      button {
        appearance: none;
        border: none;
        background: var(--purple);
        color: #fff;
        font-weight: 600;
        font-size: 1rem;
        padding: 12px 20px;
        border-radius: 12px;
        cursor: pointer;
        width: 100%;
      }
      button:active { opacity: 0.9; }
      .hint { margin-top: 14px; font-size: 0.8rem; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">● Offline mode</div>
      <h1>You're offline</h1>
      <p>
        Busmo can't reach the network right now. Opened pages and cached products
        still work. Sales you record offline will sync automatically when you're back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
      <div class="hint">Sales, stock, and dashboard need a connection to load fresh data.</div>
    </div>
    <script>
      window.addEventListener('online', function () {
        location.reload();
      });
    </script>
  </body>
</html>
